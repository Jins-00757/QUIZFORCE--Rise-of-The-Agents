<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Quizforce: Rise of the Agents</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     

    <div id="start-screen">
        
        <h1>Quizforce: Rise of the Agents</h1>
       
        <p>Test your Salesforce knowledge</p>

        <input type="text" id="player-name" placeholder="Enter your name">
        
    <div class="button-group"> 
        <button id="start-btn">Start Quiz</button>
        <button id="restart-btn">Restart Quiz</button>
        </div>
    </div>

   

    <div id="quiz-area" style="display:none;">
        <h2>Eligibility Quiz</h2>
        <p id="welcome-msg"></p>
        <p>Questions will appear here....</p>
        <button id="next-btn">Next Question</button>
    </div>

   

    <div id="scoreboard" style="display:none;">
        <p>Score: <span id="score">0</span> </p>
         <p>Lives: <span id="score">5</span> </p>
          <p>Level: <span id="score">Eligibility</span> </p>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
