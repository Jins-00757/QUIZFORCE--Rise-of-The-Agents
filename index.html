<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Quizforce: Rise of the Agents</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Start Screen -->
  <section id="start-screen">
    <!-- Left controls -->
    <div id="left-controls">
      <img id="volume-icon" src="./icons/audioOff.png" alt="Volume Icon" class="icon-btn">
    </div>

    <!-- Right controls -->
    <div id="right-controls">
      <img id="close-icon" src="./icons/cross.png" alt="Close Icon" class="icon-btn">
    </div>

    <!-- Logo and banner -->
    <img src="./images/sf-quiz-logo.png" alt="Quizforce Logo" id="game-logo">
    <h1>Quizforce: Rise of the Agents</h1>
    <p class="subtitle">Test your Salesforce knowledge!</p>
    <div class="tap-banner">Tap to Begin</div>
    <button id="start-btn">Start Quiz</button>
  </section>

  <!-- Eligibility Quiz -->
 <section id="eligibility-quiz" class="hidden">
    <h2>Eligibility Quiz</h2>

    <!-- Next icon -->
  <div id="next-container">
    <img src="./icons/next.png" alt="Next Icon" id="next-icon">
  </div>
     

    <!-- <p>Answer at least 2 out of 3 questions correctly to unlock the main game.</p>-->

    <div id="scoreboard">
      <p>Score: <span id="score">0</span>/3</p>
    </div>

    <div class="question active">
      <p><strong>Q1:</strong> Salesforce is primarily a platform for…</p>
      <button class="quiz-option" data-correct="true">Customer Relationship Management (CRM)</button>
      <button class="quiz-option">Video Streaming</button>
      <button class="quiz-option">Food Delivery</button>
    </div>

    <!-- Next icon -->
  <div id="next-container">
    <img src="./icons/next.png" alt="Next Icon" id="next-icon">
  </div>

   

    <button id="submit-quiz">Submit Answers</button>

    <div id="moving-image-container">
    <img src="./images/Astro.png" alt="Mascot" id="moving-image">
    </div>
  </section>

  <!-- Main Game -->
  <section id="main-game" class="hidden">
    <h2>Welcome to the Main Game!</h2>
    <p>You unlocked the adventure. Let’s begin!</p>
  </section>

  <!-- Background audio -->
  <audio id="bg-audio" src="background-music.mp3" loop></audio>
</body>
<script src="script.js"></script>   
</html>
